[build-system]
# Upper-bounded: hatchling >=1.30 emits core Metadata-Version 2.5, which current
# twine and PyPI's upload validation reject (this broke the 0.4.2 OIDC publish).
# Pin below it so the build produces 2.4 artifacts that upload cleanly. Lift the
# cap once PyPI/twine accept 2.5.
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "claude-replay"
description = "Session checkpoint and recovery layer for Claude Code — resume interrupted sessions, export shareable HTML traces."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Constripacity" }]
keywords = ["mcp", "claude-code", "agent", "replay", "checkpoint", "recovery", "session"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Libraries",
]
dynamic = ["version"]
dependencies = [
    # Every dependency is upper-bounded below its next major. Deps install
    # unpinned in CI, so without caps a new major silently breaks a released
    # line — mcp 2.0 removed the low-level `@server.list_tools()`/
    # `@server.call_tool()` decorator API this server uses, which made an
    # unbounded `mcp` uninstallable on fresh envs. Lift each cap deliberately
    # (and re-test) when adopting the next major.
    "mcp>=1.0.0,<3",
    "starlette>=0.27.0,<2",
    "uvicorn>=0.24.0,<1",
    "anyio>=4.0,<5",
]

[project.optional-dependencies]
tui = [
    "textual>=0.79.0,<9",
    "httpx>=0.27.0,<1",
]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27.0,<1",
    "ruff>=0.6,<0.17",
    "textual>=0.79.0,<9",
]

[project.urls]
Homepage = "https://github.com/constripacity/Claude-Replay"
Repository = "https://github.com/constripacity/Claude-Replay"
Issues = "https://github.com/constripacity/Claude-Replay/issues"

[project.scripts]
claude-replay = "claude_replay.cli:main"

[tool.hatch.version]
path = "claude_replay/store.py"

[tool.hatch.build.targets.wheel]
packages = ["claude_replay"]

[tool.hatch.build.targets.sdist]
include = [
    "/claude_replay",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
    "/CHANGELOG.md",
    "/CLAUDE.md",
    "/pyproject.toml",
    "/pytest.ini",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pin the rule set to ruff's historical default (E4/E7/E9/F). CI runs
# `ruff check .` with an unpinned ruff; a release that broadens ruff's default
# rules would otherwise turn CI red on unchanged code (ruff 0.16 did that).
# Adopting more rule families is a deliberate, separate change.
select = ["E4", "E7", "E9", "F"]
